[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/productos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/imagenes/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/iconos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
